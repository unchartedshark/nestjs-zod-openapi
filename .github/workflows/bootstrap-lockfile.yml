name: Bootstrap committed npm lockfile

on:
  push:
    paths:
      - .github/workflows/bootstrap-lockfile.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Generate lockfile using current dependency versions
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit deterministic resolution
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git diff --cached --exit-code && exit 0
          git commit -m "chore: commit npm lockfile for reproducible builds"
          git push origin HEAD:main
